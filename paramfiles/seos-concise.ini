----------------------------
----> background parameters:
----------------------------

H0 = 73.22        
omega_b = 0.02225  
omega_cdm = 0.1568

----------------------------
----> SEOS fluid parameters:
----------------------------
w0_fld = -0.92
wa_fld = -0.07
q_fld = 9.97
zt_fld = 0.28
Omega_fld = 0.66
cs2_fld = 1

--------------------------------
----> thermodynamics parameters:
--------------------------------

reio_parametrization = reio_camb
z_reio = 10.

----------------------------------------------------
----> define which perturbations should be computed:
----------------------------------------------------

