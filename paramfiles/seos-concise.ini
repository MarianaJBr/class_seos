-------------------------------
----> output file and settings:
-------------------------------


headers = yup
write background = yes
write parameters = yes
background_verbose = 3
root = output/seospaper/testseos

---------------------------------------------
----> define primordial perturbation spectra:
---------------------------------------------

A_s_ad = 2.3e-9
n_s_ad = 1.

----------------------------------------
----> parameters for the output spectra:
----------------------------------------

l_scalar_max = 2500
P_k_max_h/Mpc = 1.0
z_pk = 0., 0.28, 1., 10., 50.
